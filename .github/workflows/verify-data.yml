name: Verify Data

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'

  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun ci
      - name: Check Snapshot Against Wikidata
        run: bun run test:live
